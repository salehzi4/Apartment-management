<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وحدة إدارة الشقق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; margin: 0;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; border: 2px dashed #cbd5e1; border-radius: 16px;
                padding: 40px; text-align: center; color: #475569; max-width: 460px; }
        .card i { font-size: 48px; color: #f59e0b; margin-bottom: 16px; }
        .card h2 { color: #1e293b; margin: 0 0 8px; }
    </style>
</head>
<body>
    <div class="card">
        <i class="fas fa-screwdriver-wrench"></i>
        <h2>وحدة إدارة الشقق</h2>
        <p>قيد البناء في الخطوة التالية (المرحلة 3-ب): العقود، الدفعات، الملخّص الشهري،
        وسحب مبلغ الكهرباء تلقائياً من القاعدة الموحّدة.</p>
    </div>
</body>
</html>
