<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العقارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Cairo', sans-serif; background: #f1f5f9; }
        body { display: flex; flex-direction: column; }

        .app-bar {
            background: #1e293b; color: #fff;
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 18px; flex-wrap: wrap; gap: 10px;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
        .brand i { color: #fbbf24; font-size: 22px; }
        .conn { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #334155; color: #cbd5e1; }

        .tabs { display: flex; gap: 4px; background: #0f172a; padding: 6px 12px; }
        .tab {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 18px; border: none; cursor: pointer;
            background: transparent; color: #94a3b8; font-family: inherit;
            font-weight: 600; font-size: 15px; border-radius: 8px 8px 0 0; transition: all .2s;
        }
        .tab:hover { color: #e2e8f0; background: #1e293b; }
        .tab.active { color: #fff; background: #f1f5f9; color: #1e293b; }
        .tab.bills.active { box-shadow: inset 0 -3px 0 #6366f1; }
        .tab.apts.active  { box-shadow: inset 0 -3px 0 #f59e0b; }

        .stage { flex: 1; position: relative; }
        .frame {
            position: absolute; inset: 0; width: 100%; height: 100%;
            border: none; background: #f1f5f9; display: none;
        }
        .frame.active { display: block; }

        .hint {
            position: absolute; inset: 0; display: none;
            align-items: center; justify-content: center; text-align: center;
            color: #64748b; flex-direction: column; gap: 12px; padding: 20px;
        }
    </style>
</head>
<body>
    <div class="app-bar">
        <div class="brand"><i class="fas fa-building-flag"></i> نظام إدارة العقارات</div>
        <span class="conn"><i class="fas fa-database"></i> قاعدة موحّدة — Supabase</span>
    </div>

    <div class="tabs">
        <button class="tab apts active" data-target="apts"><i class="fas fa-home"></i> إدارة الشقق</button>
        <button class="tab bills" data-target="bills"><i class="fas fa-bolt"></i> فواتير الكهرباء</button>
    </div>

    <div class="stage">
        <iframe id="frame-apts"  class="frame active" data-src="apartments.html"></iframe>
        <iframe id="frame-bills" class="frame" data-src="billing.html"></iframe>
    </div>

    <script>
        // تحميل كسول: لا نحمّل الـ iframe إلا عند فتح تبويبه أول مرة (أداء أفضل)
        function activate(target) {
            document.querySelectorAll('.tab').forEach(t =>
                t.classList.toggle('active', t.dataset.target === target));
            document.querySelectorAll('.frame').forEach(f => f.classList.remove('active'));
            const frame = document.getElementById('frame-' + target);
            if (frame.dataset.src && !frame.src) frame.src = frame.dataset.src; // أول تحميل
            frame.classList.add('active');
        }
        document.querySelectorAll('.tab').forEach(t =>
            t.addEventListener('click', () => activate(t.dataset.target)));
        // افتح تبويب إدارة الشقق افتراضياً
        activate('apts');
    </script>
</body>
</html>
