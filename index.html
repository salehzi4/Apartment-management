<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العقارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Cairo', sans-serif; background: #f1f5f9; }
        body { display: flex; flex-direction: column; }

        .app-bar { background: #1e293b; color: #fff; display: flex; align-items: center;
            justify-content: space-between; padding: 10px 18px; flex-wrap: wrap; gap: 10px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
        .brand i { color: #fbbf24; font-size: 22px; }
        .bar-left { display: flex; align-items: center; gap: 14px; }
        .conn { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #334155; color: #cbd5e1; }
        .user-box { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; }
        .logout { background: #475569; color: #fff; border: none; cursor: pointer; font-family: inherit;
            font-size: 12px; padding: 5px 12px; border-radius: 6px; }
        .logout:hover { background: #64748b; }

        .tabs { display: flex; gap: 4px; background: #0f172a; padding: 6px 12px; }
        .tab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border: none;
            cursor: pointer; background: transparent; color: #94a3b8; font-family: inherit; font-weight: 600;
            font-size: 15px; border-radius: 8px 8px 0 0; transition: all .2s; }
        .tab:hover { color: #e2e8f0; background: #1e293b; }
        .tab.active { background: #f1f5f9; color: #1e293b; }
        .tab.bills.active { box-shadow: inset 0 -3px 0 #6366f1; }
        .tab.apts.active  { box-shadow: inset 0 -3px 0 #f59e0b; }

        .stage { flex: 1; position: relative; }
        .frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none;
            background: #f1f5f9; display: none; }
        .frame.active { display: block; }

        /* بوابة الدخول */
        #gate { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center;
            justify-content: center; z-index: 50; }
        .login-card { background: #fff; border-radius: 16px; padding: 36px 32px; width: 360px; max-width: 92vw;
            box-shadow: 0 20px 50px rgba(0,0,0,.3); }
        .login-card h2 { color: #1e293b; text-align: center; margin-bottom: 6px; display: flex;
            align-items: center; justify-content: center; gap: 10px; }
        .login-card h2 i { color: #f59e0b; }
        .login-card p { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 22px; }
        .login-card label { display: block; font-size: 13px; color: #475569; margin: 12px 0 6px; font-weight: 600; }
        .login-card input { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 9px;
            font-family: inherit; font-size: 14px; }
        .login-card input:focus { outline: none; border-color: #6366f1; }
        .login-btn { width: 100%; margin-top: 20px; padding: 12px; background: #1e293b; color: #fff; border: none;
            border-radius: 9px; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
        .login-btn:hover { background: #334155; }
        .login-btn:disabled { opacity: .6; cursor: default; }
        .login-err { color: #dc2626; font-size: 13px; text-align: center; margin-top: 14px; min-height: 18px; }
        .app-wrap { display: none; flex-direction: column; height: 100%; }
        .app-wrap.shown { display: flex; }
    </style>
</head>
<body>
    <!-- بوابة الدخول -->
    <div id="gate">
        <div class="login-card">
            <h2><i class="fas fa-building-flag"></i> نظام إدارة العقارات</h2>
            <p>سجّل الدخول للمتابعة</p>
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" autocomplete="username" placeholder="you@example.com">
            <label>كلمة المرور</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
            <button class="login-btn" id="loginBtn">دخول</button>
            <div class="login-err" id="loginErr"></div>
        </div>
    </div>

    <!-- التطبيق (يظهر بعد الدخول) -->
    <div class="app-wrap" id="app">
        <div class="app-bar">
            <div class="brand"><i class="fas fa-building-flag"></i> نظام إدارة العقارات</div>
            <div class="bar-left">
                <span class="conn"><i class="fas fa-database"></i> قاعدة موحّدة — Supabase</span>
                <span class="user-box"><i class="fas fa-user-circle"></i><span id="userEmail"></span></span>
                <button class="logout" id="refreshBtn" title="تحديث البيانات"><i class="fas fa-rotate"></i></button>
                <button class="logout" id="logoutBtn">خروج</button>
            </div>
        </div>
        <div class="tabs">
            <button class="tab apts active" data-target="apts"><i class="fas fa-home"></i> إدارة الشقق</button>
            <button class="tab bills" data-target="bills"><i class="fas fa-bolt"></i> فواتير الكهرباء</button>
        </div>
        <div class="stage">
            <iframe id="frame-apts"  class="frame active" data-src="apartments.html"></iframe>
            <iframe id="frame-bills" class="frame" data-src="billing.html"></iframe>
        </div>
    </div>

    <script>
        var gate = document.getElementById('gate');
        var app  = document.getElementById('app');

        var currentTarget = 'apts';
        var appShown = false;

        function showApp(user) {
            gate.style.display = 'none';
            app.classList.add('shown');
            document.getElementById('userEmail').textContent = user.email || '';
            appShown = true;
            // (أعد)تحميل التبويب النشط بمصدر طازج ليجلب البيانات بعد جاهزية الجلسة
            loadFrame(currentTarget, true);
        }
        function showGate() {
            appShown = false;
            app.classList.remove('shown');
            gate.style.display = 'flex';
            ['frame-apts','frame-bills'].forEach(function(id){
                var f = document.getElementById(id); f.src = 'about:blank'; });
        }

        // يحمّل/يعيد تحميل iframe التبويب. force=true يعيد التحميل دائماً.
        function loadFrame(target, force) {
            var frame = document.getElementById('frame-' + target);
            if (!frame) return;
            if (force || !frame.src || frame.src === 'about:blank' ||
                frame.src.indexOf('about:blank') !== -1) {
                // كسر الكاش لضمان تحميل جديد يقرأ الجلسة الحالية
                frame.src = frame.dataset.src + '?t=' + Date.now();
            }
        }

        function activate(target) {
            currentTarget = target;
            document.querySelectorAll('.tab').forEach(function(t){
                t.classList.toggle('active', t.dataset.target === target); });
            document.querySelectorAll('.frame').forEach(function(f){ f.classList.remove('active'); });
            var frame = document.getElementById('frame-' + target);
            if (appShown) loadFrame(target, false); // حمّله إن لم يكن محمّلاً
            frame.classList.add('active');
        }
        document.querySelectorAll('.tab').forEach(function(t){
            t.addEventListener('click', function(){ activate(t.dataset.target); }); });

        // الدخول
        var btn = document.getElementById('loginBtn');
        async function doLogin() {
            var email = document.getElementById('email').value.trim();
            var pass  = document.getElementById('password').value;
            var err   = document.getElementById('loginErr');
            err.textContent = '';
            if (!email || !pass) { err.textContent = 'أدخل البريد وكلمة المرور'; return; }
            btn.disabled = true; btn.textContent = 'جارٍ الدخول...';
            try {
                var res = await window.Auth.signIn(email, pass);
                if (res.error) { err.textContent = 'تعذّر الدخول: ' + res.error.message; }
                // النجاح يُعالَج في onChange (يستدعي showApp)
            } catch (e) { err.textContent = 'خطأ: ' + e.message; }
            btn.disabled = false; btn.textContent = 'دخول';
        }
        btn.addEventListener('click', doLogin);
        document.getElementById('password').addEventListener('keydown', function(e){
            if (e.key === 'Enter') doLogin(); });

        // الخروج
        document.getElementById('logoutBtn').addEventListener('click', async function(){
            await window.Auth.signOut();
        });
        // تحديث البيانات (مفيد في وضع التطبيق على الشاشة الرئيسية بلا زر تحديث)
        document.getElementById('refreshBtn').addEventListener('click', function(){
            if (appShown) loadFrame(currentTarget, true);
        });

        // تتبّع حالة الجلسة. نتفادى إعادة التحميل المكررة بمقارنة الحالة السابقة.
        var lastSignedIn = null;
        window.Auth.onChange(function(_event, session){
            var signedIn = !!(session && session.user);
            if (signedIn && lastSignedIn !== true) { lastSignedIn = true; showApp(session.user); }
            else if (!signedIn && lastSignedIn !== false) { lastSignedIn = false; showGate(); }
        });
        // فحص أولي: ننتظر getSession (يقرأ الجلسة المحفوظة) قبل أي قرار، تفادياً للوميض
        window.sbClient.auth.getSession().then(function(res){
            var session = res && res.data ? res.data.session : null;
            if (session && session.user) { lastSignedIn = true; showApp(session.user); }
            else { lastSignedIn = false; showGate(); }
        }).catch(function(){ lastSignedIn = false; showGate(); });
    </script>
</body>
</html>
